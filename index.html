<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My AI — Video Generator</title>
<link rel="icon" href="https://raw.githubusercontent.com/tvink001v-ops/My-AI/34ed798eef11be3ec287b6b508cbbc15531a2c48/logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0b;
    color: #eaeaea;
    min-height: 100vh;
    padding-bottom: 70px;
  }

  /* Шапка */
  .header {
    padding: 14px 16px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .logo {
    height: 36px;
    width: auto;
    object-fit: contain;
    display: block;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-badge {
    font-size: 12px;
    background: #5b6cff;
    color: #fff;
    padding: 4px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  /* Экраны */
  .screen { display: none; }
  .screen.active { display: block; }

  .section-title {
    padding: 12px 16px 8px;
    font-size: 14px;
    color: #888;
    font-weight: 500;
  }

  /* Поле ввода */
  .input-area { padding: 0 16px; }
  .prompt-box {
    width: 100%;
    min-height: 120px;
    background: #1a1a1c;
    border: 1px solid #2a2a2e;
    border-radius: 14px;
    color: #eaeaea;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
  }
  .prompt-box:focus { border-color: #5b6cff; }
  .prompt-box::placeholder { color: #555; }

  /* Кнопка генерации */
  .generate-btn {
    width: calc(100% - 32px);
    margin: 12px 16px;
    padding: 15px;
    background: #5b6cff;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .generate-btn:active { background: #4a5aee; }
  .generate-btn:disabled { opacity: 0.5; }

  /* Статус */
  #status {
    text-align: center;
    font-size: 13px;
    color: #888;
    padding: 8px 16px;
    min-height: 20px;
  }
  #result {
    margin: 12px 16px;
    display: none;
  }
  #result video {
    width: 100%;
    border-radius: 14px;
    background: #000;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #5b6cff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Галерея */
  .gallery {
    padding: 0 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .gallery-item {
    background: #1a1a1c;
    border: 1px solid #2a2a2e;
    border-radius: 12px;
    overflow: hidden;
  }
  .gallery-item video {
    width: 100%;
    display: block;
    background: #000;
  }
  .gallery-item .meta {
    padding: 8px;
    font-size: 10px;
    color: #666;
    line-height: 1.3;
    height: 34px;
    overflow: hidden;
  }
  .empty {
    text-align: center;
    color: #555;
    font-size: 14px;
    padding: 60px 20px;
  }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }

  /* Нижние табы */
  .tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #131315;
    border-top: 1px solid #2a2a2e;
    display: flex;
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    font-size: 11px;
    color: #666;
    cursor: pointer;
    user-select: none;
  }
  .tab.active { color: #5b6cff; }
  .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }

  /* Экран регистрации */
  #authScreen {
    display: none;
    padding: 60px 24px;
    text-align: center;
  }
  #authScreen h2 { font-size: 22px; margin-bottom: 8px; }
  #authScreen p { font-size: 13px; color: #888; margin-bottom: 24px; }
  #authScreen input {
    width: 100%;
    padding: 14px;
    background: #1a1a1c;
    border: 1px solid #2a2a2e;
    border-radius: 12px;
    color: #eaeaea;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
  }
  #authScreen input:focus { border-color: #5b6cff; }
  #authScreen button {
    width: 100%;
    padding: 14px;
    background: #5b6cff;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
  }
  #authStatus {
    margin-top: 12px;
    font-size: 13px;
    color: #f55;
    min-height: 18px;
  }
</style>
</head>
<body>

<!-- Экран регистрации -->
<div id="authScreen">
  <img src="https://raw.githubusercontent.com/tvink001v-ops/My-AI/34ed798eef11be3ec287b6b508cbbc15531a2c48/logo.png" 
       alt="My AI" style="height:60px;margin-bottom:16px;">
  <h2>My AI</h2>
  <p>Введите имя, чтобы начать</p>
  <input type="text" id="username" placeholder="Ваше имя" maxlength="20">
  <button id="registerBtn">Продолжить</button>
  <div id="authStatus"></div>
</div>

<!-- Основное приложение -->
<div id="appScreen" style="display:none;">
  <div class="header">
    <div class="logo-wrap">
      <img src="https://raw.githubusercontent.com/tvink001v-ops/My-AI/34ed798eef11be3ec287b6b508cbbc15531a2c48/logo.png" 
           alt="My AI" class="logo">
      <h1 id="pageTitle">Создать</h1>
    </div>
    <div class="user-badge" id="userBadge"></div>
  </div>

  <!-- Экран создания -->
  <div class="screen active" id="createScreen">
    <div class="section-title">📝 Опишите видео</div>
    <div class="input-area">
      <textarea id="prompt" class="prompt-box" placeholder="Например: кот едет на скейтборде по закату, кинематографично..."></textarea>
    </div>
    <button id="generateBtn" class="generate-btn">Сгенерировать видео</button>
    <div id="status"></div>
    <div id="result">
      <video id="video" controls autoplay loop muted playsinline></video>
    </div>
  </div>

  <!-- Экран «Мои видео» -->
  <div class="screen" id="myVideosScreen">
    <div class="section-title">🎞 Мои видео</div>
    <div id="galleryContainer">
      <div class="empty" id="emptyState">
        <div class="empty-icon">📭</div>
        Пока нет сгенерированных видео
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>

  <!-- Нижние табы -->
  <div class="tabs">
    <div class="tab active" data-screen="createScreen">
      <span class="tab-icon">✨</span>
      Создать
    </div>
    <div class="tab" data-screen="myVideosScreen">
      <span class="tab-icon">🎞</span>
      Мои видео
    </div>
  </div>
</div>

<script>
  // ==== НАСТРОЙКИ ====
  const AGNES_API_KEY = "sk-uZkVKuXXiLdrNvPalOdJnNwvRuxd2vWCvnciVcZhtSKNEtw9";
  const AGNES_API_URL = "https://apihub.agnes-ai.com/v1/videos";
  const AGNES_POLL_URL = "https://apihub.agnes-ai.com/agnesapi";
  const MODEL_NAME = "agnes-video-2.5-flash";
  const DAILY_LIMIT = 5;
  // ===================

  const authScreen = document.getElementById("authScreen");
  const appScreen = document.getElementById("appScreen");
  const usernameInput = document.getElementById("username");
  const registerBtn = document.getElementById("registerBtn");
  const authStatus = document.getElementById("authStatus");
  const userBadge = document.getElementById("userBadge");
  const pageTitle = document.getElementById("pageTitle");
  const promptEl = document.getElementById("prompt");
  const generateBtn = document.getElementById("generateBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const videoEl = document.getElementById("video");
  const gallery = document.getElementById("gallery");
  const emptyState = document.getElementById("emptyState");

  // --- Регистрация ---
  function checkAuth() {
    const user = localStorage.getItem("vg_username");
    if (user) {
      userBadge.textContent = user;
      authScreen.style.display = "none";
      appScreen.style.display = "block";
      loadGallery();
    } else {
      authScreen.style.display = "block";
      appScreen.style.display = "none";
    }
  }

  registerBtn.addEventListener("click", () => {
    const name = usernameInput.value.trim();
    if (!name) {
      authStatus.textContent = "Введите имя";
      return;
    }
    localStorage.setItem("vg_username", name);
    checkAuth();
  });

  // --- Табы ---
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      tab.classList.add("active");
      const screenId = tab.getAttribute("data-screen");
      document.getElementById(screenId).classList.add("active");
      pageTitle.textContent = screenId === "createScreen" ? "Создать" : "Мои видео";
      if (screenId === "myVideosScreen") loadGallery();
    });
  });

  // --- Лимит на браузер ---
  function getTodayKey() {
    const d = new Date();
    return `vg_usage_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
  }
  function getUsage() {
    return parseInt(localStorage.getItem(getTodayKey()) || "0", 10);
  }
  function incrementUsage() {
    localStorage.setItem(getTodayKey(), String(getUsage() + 1));
  }

  // --- Галерея ---
  function getMyVideos() {
    try {
      return JSON.parse(localStorage.getItem("vg_videos") || "[]");
    } catch { return []; }
  }
  function saveVideo(videoUrl, prompt) {
    const videos = getMyVideos();
    videos.unshift({
      url: videoUrl,
      prompt: prompt,
      date: new Date().toISOString()
    });
    localStorage.setItem("vg_videos", JSON.stringify(videos.slice(0, 20)));
  }
  function loadGallery() {
    const videos = getMyVideos();
    gallery.innerHTML = "";
    if (videos.length === 0) {
      emptyState.style.display = "block";
      gallery.style.display = "none";
      return;
    }
    emptyState.style.display = "none";
    gallery.style.display = "grid";
    videos.forEach(v => {
      const item = document.createElement("div");
      item.className = "gallery-item";
      const dateStr = new Date(v.date).toLocaleDateString("ru-RU");
      item.innerHTML = `
        <video src="${v.url}" controls muted playsinline preload="metadata"></video>
        <div class="meta">${v.prompt.slice(0, 50)}<br>${dateStr}</div>
      `;
      gallery.appendChild(item);
    });
  }

  // --- Генерация ---
  generateBtn.addEventListener("click", async () => {
    const prompt = promptEl.value.trim();
    if (!prompt) {
      statusEl.textContent = "Введите описание видео";
      return;
    }

    if (getUsage() >= DAILY_LIMIT) {
      statusEl.textContent = `❌ Лимит на сегодня исчерпан (${DAILY_LIMIT} генераций). Попробуйте завтра.`;
      return;
    }

    generateBtn.disabled = true;
    resultEl.style.display = "none";
    statusEl.innerHTML = '<span class="spinner"></span>Создаю задачу...';

    try {
      const createRes = await fetch(AGNES_API_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${AGNES_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: MODEL_NAME,
          prompt: prompt,
          seconds: "5",
          mode: "text",
          size: "720P",
          aspect_ratio: "16:9"
        })
      });

      if (!createRes.ok) {
        const err = await createRes.text();
        throw new Error(`Ошибка ${createRes.status}: ${err.slice(0, 150)}`);
      }

      const createData = await createRes.json();
      const videoId = createData.video_id;
      if (!videoId) throw new Error("Не получил video_id");

      statusEl.innerHTML = '<span class="spinner"></span>Видео генерируется...';
      let videoUrl = null;

      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 3000));
        const pollRes = await fetch(
          `${AGNES_POLL_URL}?video_id=${videoId}&model_name=${MODEL_NAME}`,
          { headers: { "Authorization": `Bearer ${AGNES_API_KEY}` } }
        );
        if (!pollRes.ok) continue;
        const pollData = await pollRes.json();
        const st = pollData.status;

        if (st === "completed") {
          videoUrl = pollData.video_url || pollData.url;
          break;
        }
        if (st === "failed") {
          throw new Error("Генерация не удалась");
        }
      }

      if (!videoUrl) throw new Error("Превышено время ожидания");

      videoEl.src = videoUrl;
      resultEl.style.display = "block";
      statusEl.textContent = "✅ Готово! Видео сохранено в «Мои видео»";
      incrementUsage();
      saveVideo(videoUrl, prompt);

    } catch (e) {
      statusEl.textContent = "❌ " + e.message;
    } finally {
      generateBtn.disabled = false;
    }
  });

  checkAuth();
</script>
</body>
</html>
