<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My AI — Video Generator</title>
<link rel="icon" href="https://raw.githubusercontent.com/tvink001v-ops/My-AI/34ed798eef11be3ec287b6b508cbbc15531a2c48/logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0b;
    color: #eaeaea;
    min-height: 100vh;
    padding-bottom: 70px;
  }

  /* Шапка */
  .header {
    padding: 14px 16px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { height: 36px; width: auto; object-fit: contain; display: block; }
  .header h1 {
    font-size: 18px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .user-badge {
    font-size: 12px; background: #5b6cff; color: #fff;
    padding: 4px 10px; border-radius: 20px; flex-shrink: 0;
  }

  /* Экраны */
  .screen { display: none; }
  .screen.active { display: block; }

  .section-title {
    padding: 12px 16px 8px;
    font-size: 14px; color: #888; font-weight: 500;
  }

  /* Переключатель режима */
  .mode-switch {
    display: flex;
    gap: 6px;
    padding: 0 16px 12px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px;
    background: #1a1a1c;
    border: 1px solid #2a2a2e;
    border-radius: 12px;
    color: #888;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: #5b6cff;
    border-color: #5b6cff;
    color: #fff;
  }
  .mode-btn:active { transform: scale(0.98); }

  /* Поле ввода */
  .input-area { padding: 0 16px; }
  .prompt-box {
    width: 100%;
    min-height: 100px;
    background: #1a1a1c;
    border: 1px solid #2a2a2e;
    border-radius: 14px;
    color: #eaeaea;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
  }
  .prompt-box:focus { border-color: #5b6cff; }
  .prompt-box::placeholder { color: #555; }

  /* Загрузка фото */
  .photo-upload {
    margin: 0 16px;
    padding: 24px 16px;
    border: 2px dashed #2a2a2e;
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    transition: border 0.2s;
    background: #1a1a1c;
  }
  .photo-upload:active { border-color: #5b6cff; }
  .photo-upload.has-photo { padding: 8px; border-style: solid; border-color: #5b6cff; }
  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { font-size: 13px; color: #888; line-height: 1.4; }
  .preview-img {
    width: 100%; max-height: 240px;
    object-fit: contain; border-radius: 10px;
    display: block;
  }
  .remove-photo {
    margin-top: 8px;
    background: transparent;
    border: 1px solid #2a2a2e;
    color: #888;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  #photoInput { display: none; }

  /* Кнопка генерации */
  .generate-btn {
    width: calc(100% - 32px);
    margin: 12px 16px;
    padding: 15px;
    background: #5b6cff;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .generate-btn:active { background: #4a5aee; }
  .generate-btn:disabled { opacity: 0.5; }

  /* Прогресс-бар */
  .progress {
    margin: 8px 16px;
    height: 4px;
    background: #1a1a1c;
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .progress.active { display: block; }
  .progress-bar {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #5b6cff, #8b9cff);
    border-radius: 2px;
    animation: slide 1.5s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }

  #status {
    text-align: center;
    font-size: 13px;
    color: #888;
    padding: 8px 16px;
    min-height: 20px;
    line-height: 1.4;
  }
  #result {
    margin: 12px 16px;
    display: none;
  }
  #result video {
    width: 100%;
    border-radius: 14px;
    background: #000;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #5b6cff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Галерея */
  .gallery {
    padding: 0 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .gallery-item {
    background: #1a1a1c;
    border: 1px solid #2a2a2e;
    border-radius: 12px;
    overflow: hidden;
  }
  .gallery-item video {
    width: 100%;
    display: block;
    background: #000;
  }
  .gallery-item .meta {
    padding: 8px;
    font-size: 10px;
    color: #666;
    line-height: 1.3;
    height: 34px;
    overflow: hidden;
  }
  .empty {
    text-align: center;
    color: #555;
    font-size: 14px;
    padding: 60px 20px;
  }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }

  /* Нижние табы */
  .tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #131315;
    border-top: 1px solid #2a2a2e;
    display: flex;
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    font-size: 11px;
    color: #666;
    cursor: pointer;
    user-select: none;
  }
  .tab.active { color: #5b6cff; }
  .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }

  /* Экран регистрации */
  #authScreen {
    display: none;
    padding: 60px 24px;
    text-align: center;
  }
  #authScreen h2 { font-size: 22px; margin-bottom: 8px; }
  #authScreen p { font-size: 13px; color: #888; margin-bottom: 24px; }
  #authScreen input {
    width: 100%;
    padding: 14px;
    background: #1a1a1c;
    border: 1px solid #2a2a2e;
    border-radius: 12px;
    color: #eaeaea;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
  }
  #authScreen input:focus { border-color: #5b6cff; }
  #authScreen button {
    width: 100%;
    padding: 14px;
    background: #5b6cff;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
  }
  #authStatus {
    margin-top: 12px;
    font-size: 13px;
    color: #f55;
    min-height: 18px;
  }
</style>
</head>
<body>

<!-- Экран регистрации -->
<div id="authScreen">
  <img src="https://raw.githubusercontent.com/tvink001v-ops/My-AI/34ed798eef11be3ec287b6b508cbbc15531a2c48/logo.png"
       alt="My AI" style="height:60px;margin-bottom:16px;">
  <h2>My AI</h2>
  <p>Введите имя, чтобы начать</p>
  <input type="text" id="username" placeholder="Ваше имя" maxlength="20">
  <button id="registerBtn">Продолжить</button>
  <div id="authStatus"></div>
</div>

<!-- Основное приложение -->
<div id="appScreen" style="display:none;">
  <div class="header">
    <div class="logo-wrap">
      <img src="https://raw.githubusercontent.com/tvink001v-ops/My-AI/34ed798eef11be3ec287b6b508cbbc15531a2c48/logo.png"
           alt="My AI" class="logo">
      <h1 id="pageTitle">Создать</h1>
    </div>
    <div class="user-badge" id="userBadge"></div>
  </div>

  <!-- Экран создания -->
  <div class="screen active" id="createScreen">
    <!-- Переключатель режима -->
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="text">📝 Текст → Видео</button>
      <button class="mode-btn" data-mode="image">🖼 Фото → Видео</button>
    </div>

    <!-- Загрузка фото (только для режима image) -->
    <div id="photoBlock" style="display:none;">
      <div class="photo-upload" id="photoUpload">
        <div id="uploadEmpty">
          <div class="upload-icon">📷</div>
          <div class="upload-text">Нажмите, чтобы выбрать фото<br>или перетащите сюда</div>
        </div>
        <div id="uploadPreview" style="display:none;">
          <img id="previewImg" class="preview-img" alt="preview">
          <button class="remove-photo" id="removePhoto">✕ Убрать фото</button>
        </div>
      </div>
      <input type="file" id="photoInput" accept="image/*">
    </div>

    <div class="section-title" id="promptTitle">📝 Опишите видео</div>
    <div class="input-area">
      <textarea id="prompt" class="prompt-box" placeholder="Например: кот едет на скейтборде по закату, кинематографично..."></textarea>
    </div>

    <button id="generateBtn" class="generate-btn">
      <span id="btnText">✨ Сгенерировать видео</span>
    </button>

    <div class="progress" id="progress"><div class="progress-bar"></div></div>
    <div id="status"></div>
    <div id="result">
      <video id="video" controls autoplay loop muted playsinline></video>
    </div>
  </div>

  <!-- Экран «Мои видео» -->
  <div class="screen" id="myVideosScreen">
    <div class="section-title">🎞 Мои видео</div>
    <div id="galleryContainer">
      <div class="empty" id="emptyState">
        <div class="empty-icon">📭</div>
        Пока нет сгенерированных видео
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>

  <!-- Нижние табы -->
  <div class="tabs">
    <div class="tab active" data-screen="createScreen">
      <span class="tab-icon">✨</span>
      Создать
    </div>
    <div class="tab" data-screen="myVideosScreen">
      <span class="tab-icon">🎞</span>
      Мои видео
    </div>
  </div>
</div>

<script>
  // ==== НАСТРОЙКИ ====
  const AGNES_API_KEY = "sk-uZkVKuXXiLdrNvPalOdJnNwvRuxd2vWCvnciVcZhtSKNEtw9";
  const AGNES_API_URL = "https://apihub.agnes-ai.com/v1/videos";
  const AGNES_POLL_URL = "https://apihub.agnes-ai.com/agnesapi";
  const MODEL_NAME = "agnes-video-2.5-flash";
  const DAILY_LIMIT = 5;
  const MAX_RETRIES = 5;
  const RETRY_DELAY = 15000; // 15 сек между попытками
  // ===================

  const authScreen = document.getElementById("authScreen");
  const appScreen = document.getElementById("appScreen");
  const usernameInput = document.getElementById("username");
  const registerBtn = document.getElementById("registerBtn");
  const authStatus = document.getElementById("authStatus");
  const userBadge = document.getElementById("userBadge");
  const pageTitle = document.getElementById("pageTitle");
  const promptEl = document.getElementById("prompt");
  const promptTitle = document.getElementById("promptTitle");
  const generateBtn = document.getElementById("generateBtn");
  const btnText = document.getElementById("btnText");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const videoEl = document.getElementById("video");
  const gallery = document.getElementById("gallery");
  const emptyState = document.getElementById("emptyState");
  const progress = document.getElementById("progress");

  const photoBlock = document.getElementById("photoBlock");
  const photoUpload = document.getElementById("photoUpload");
  const photoInput = document.getElementById("photoInput");
  const uploadEmpty = document.getElementById("uploadEmpty");
  const uploadPreview = document.getElementById("uploadPreview");
  const previewImg = document.getElementById("previewImg");
  const removePhoto = document.getElementById("removePhoto");

  let currentMode = "text"; // "text" или "image"
  let currentPhotoBase64 = null;

  // --- Регистрация ---
  function checkAuth() {
    const user = localStorage.getItem("vg_username");
    if (user) {
      userBadge.textContent = user;
      authScreen.style.display = "none";
      appScreen.style.display = "block";
      loadGallery();
    } else {
      authScreen.style.display = "block";
      appScreen.style.display = "none";
    }
  }

  registerBtn.addEventListener("click", () => {
    const name = usernameInput.value.trim();
    if (!name) { authStatus.textContent = "Введите имя"; return; }
    localStorage.setItem("vg_username", name);
    checkAuth();
  });

  // --- Табы ---
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      tab.classList.add("active");
      const screenId = tab.getAttribute("data-screen");
      document.getElementById(screenId).classList.add("active");
      pageTitle.textContent = screenId === "createScreen" ? "Создать" : "Мои видео";
      if (screenId === "myVideosScreen") loadGallery();
    });
  });

  // --- Переключатель режима ---
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentMode = btn.getAttribute("data-mode");

      if (currentMode === "image") {
        photoBlock.style.display = "block";
        promptTitle.textContent = "📝 Опишите движение (необязательно)";
        promptEl.placeholder = "Например: плавное движение камеры, лёгкий ветер...";
        btnText.textContent = "🖼 Оживить фото";
      } else {
        photoBlock.style.display = "none";
        promptTitle.textContent = "📝 Опишите видео";
        promptEl.placeholder = "Например: кот едет на скейтборде по закату, кинематографично...";
        btnText.textContent = "✨ Сгенерировать видео";
      }
    });
  });

  // --- Загрузка фото ---
  photoUpload.addEventListener("click", (e) => {
    if (e.target === removePhoto) return;
    if (!currentPhotoBase64) photoInput.click();
  });

  photoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      alert("Фото слишком большое (макс. 5 МБ)");
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentPhotoBase64 = ev.target.result;
      previewImg.src = currentPhotoBase64;
      uploadEmpty.style.display = "none";
      uploadPreview.style.display = "block";
      photoUpload.classList.add("has-photo");
    };
    reader.readAsDataURL(file);
  });

  removePhoto.addEventListener("click", (e) => {
    e.stopPropagation();
    currentPhotoBase64 = null;
    photoInput.value = "";
    uploadEmpty.style.display = "block";
    uploadPreview.style.display = "none";
    photoUpload.classList.remove("has-photo");
  });

  // --- Лимит на браузер ---
  function getTodayKey() {
    const d = new Date();
    return `vg_usage_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
  }
  function getUsage() {
    return parseInt(localStorage.getItem(getTodayKey()) || "0", 10);
  }
  function incrementUsage() {
    localStorage.setItem(getTodayKey(), String(getUsage() + 1));
  }

  // --- Галерея ---
  function getMyVideos() {
    try { return JSON.parse(localStorage.getItem("vg_videos") || "[]"); }
    catch { return []; }
  }
  function saveVideo(videoUrl, prompt) {
    const videos = getMyVideos();
    videos.unshift({ url: videoUrl, prompt: prompt, date: new Date().toISOString() });
    localStorage.setItem("vg_videos", JSON.stringify(videos.slice(0, 20)));
  }
  function loadGallery() {
    const videos = getMyVideos();
    gallery.innerHTML = "";
    if (videos.length === 0) {
      emptyState.style.display = "block";
      gallery.style.display = "none";
      return;
    }
    emptyState.style.display = "none";
    gallery.style.display = "grid";
    videos.forEach(v => {
      const item = document.createElement("div");
      item.className = "gallery-item";
      const dateStr = new Date(v.date).toLocaleDateString("ru-RU");
      item.innerHTML = `
        <video src="${v.url}" controls muted playsinline preload="metadata"></video>
        <div class="meta">${v.prompt.slice(0, 50)}<br>${dateStr}</div>
      `;
      gallery.appendChild(item);
    });
  }

  // --- Создание задачи с retry ---
  async function createTask(prompt, photoBase64) {
    for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
      statusEl.innerHTML = `<span class="spinner"></span>Создаю задачу... (попытка ${attempt}/${MAX_RETRIES})`;

      const payload = {
        model: MODEL_NAME,
        prompt: prompt || "animate this image",
        seconds: "5",
        size: "720P",
        aspect_ratio: "16:9"
      };

      if (photoBase64) {
        // ✅ ИСПРАВЛЕНО: правильный режим для Agnes Video 2.5 Flash
        payload.mode = "reference";
        payload.images = [photoBase64]; // Agnes ожидает URL или Base64
      } else {
        payload.mode = "text";
      }

      try {
        const res = await fetch(AGNES_API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${AGNES_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (res.status === 503) {
          const errText = await res.text();
          console.log("503:", errText);
          if (attempt < MAX_RETRIES) {
            statusEl.innerHTML = `<span class="spinner"></span>Очередь заполнена. Ждём ${RETRY_DELAY/1000} сек... (${attempt}/${MAX_RETRIES})`;
            await new Promise(r => setTimeout(r, RETRY_DELAY));
            continue;
          }
          throw new Error("Очередь Agnes переполнена. Попробуйте позже.");
        }

        if (res.status === 429) {
          if (attempt < MAX_RETRIES) {
            statusEl.innerHTML = `<span class="spinner"></span>Слишком много запросов. Ждём 60 сек... (${attempt}/${MAX_RETRIES})`;
            await new Promise(r => setTimeout(r, 60000));
            continue;
          }
          throw new Error("Слишком много запросов. Попробуйте через минуту.");
        }

        if (!res.ok) {
          const err = await res.text();
          throw new Error(`Ошибка ${res.status}: ${err.slice(0, 150)}`);
        }

        return await res.json();
      } catch (e) {
        if (attempt === MAX_RETRIES) throw e;
        await new Promise(r => setTimeout(r, RETRY_DELAY));
      }
    }
    throw new Error("Не удалось создать задачу");
  }

  // --- Опрос результата ---
  async function pollResult(videoId) {
    for (let i = 0; i < 60; i++) {
      await new Promise(r => setTimeout(r, 3000));
      try {
        const pollRes = await fetch(
          `${AGNES_POLL_URL}?video_id=${videoId}&model_name=${MODEL_NAME}`,
          { headers: { "Authorization": `Bearer ${AGNES_API_KEY}` } }
        );
        if (!pollRes.ok) continue;
        const pollData = await pollRes.json();
        const st = pollData.status;

        if (st === "completed") {
          return pollData.video_url || pollData.url || pollData.metadata?.url;
        }
        if (st === "failed") {
          throw new Error("Генерация не удалась");
        }
      } catch (e) {
        if (e.message === "Генерация не удалась") throw e;
      }
    }
    throw new Error("Превышено время ожидания");
  }

  // --- Генерация ---
  generateBtn.addEventListener("click", async () => {
    const prompt = promptEl.value.trim();

    // Проверка: нужен или текст, или фото
    if (currentMode === "text" && !prompt) {
      statusEl.textContent = "Введите описание видео";
      return;
    }
    if (currentMode === "image" && !currentPhotoBase64) {
      statusEl.textContent = "Загрузите фото";
      return;
    }

    if (getUsage() >= DAILY_LIMIT) {
      statusEl.textContent = `❌ Лимит на сегодня исчерпан (${DAILY_LIMIT} генераций). Попробуйте завтра.`;
      return;
    }

    generateBtn.disabled = true;
    resultEl.style.display = "none";
    progress.classList.add("active");

    try {
      const createData = await createTask(prompt, currentPhotoBase64);
      const videoId = createData.video_id;
      if (!videoId) throw new Error("Не получил video_id");

      statusEl.innerHTML = '<span class="spinner"></span>Видео генерируется... обычно 1–3 минуты';
      const videoUrl = await pollResult(videoId);

      videoEl.src = videoUrl;
      resultEl.style.display = "block";
      statusEl.textContent = "✅ Готово! Сохранено в «Мои видео»";
      incrementUsage();
      saveVideo(videoUrl, prompt || "[из фото]");

    } catch (e) {
      statusEl.textContent = "❌ " + e.message;
    } finally {
      generateBtn.disabled = false;
      progress.classList.remove("active");
    }
  });

  checkAuth();
</script>
</body>
</html>
