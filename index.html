<script>
  // ==== HUGGING FACE SPACE ====
  // Адрес твоего Space без https:// и без /
  const HF_SPACE = "st5656-my-ai-video.hf.space";
  const FN_NAME  = "generate_video";
  // ============================

  const authScreen = document.getElementById("authScreen");
  const appScreen = document.getElementById("appScreen");
  const usernameInput = document.getElementById("username");
  const registerBtn = document.getElementById("registerBtn");
  const authStatus = document.getElementById("authStatus");
  const userBadge = document.getElementById("userBadge");
  const pageTitle = document.getElementById("pageTitle");
  const promptEl = document.getElementById("prompt");
  const promptTitle = document.getElementById("promptTitle");
  const generateBtn = document.getElementById("generateBtn");
  const btnText = document.getElementById("btnText");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const videoEl = document.getElementById("video");
  const gallery = document.getElementById("gallery");
  const emptyState = document.getElementById("emptyState");
  const progress = document.getElementById("progress");

  const photoBlock = document.getElementById("photoBlock");
  const photoUpload = document.getElementById("photoUpload");
  const photoInput = document.getElementById("photoInput");
  const uploadEmpty = document.getElementById("uploadEmpty");
  const uploadPreview = document.getElementById("uploadPreview");
  const previewImg = document.getElementById("previewImg");
  const removePhoto = document.getElementById("removePhoto");

  let currentMode = "text";
  let currentPhotoBase64 = null;

  function checkAuth() {
    const user = localStorage.getItem("vg_username");
    if (user) {
      userBadge.textContent = user;
      authScreen.style.display = "none";
      appScreen.style.display = "block";
      loadGallery();
    } else {
      authScreen.style.display = "block";
      appScreen.style.display = "none";
    }
  }

  registerBtn.addEventListener("click", () => {
    const name = usernameInput.value.trim();
    if (!name) { authStatus.textContent = "Введите имя"; return; }
    localStorage.setItem("vg_username", name);
    checkAuth();
  });

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      tab.classList.add("active");
      const screenId = tab.getAttribute("data-screen");
      document.getElementById(screenId).classList.add("active");
      pageTitle.textContent = screenId === "createScreen" ? "Создать" : "Мои видео";
      if (screenId === "myVideosScreen") loadGallery();
    });
  });

  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentMode = btn.getAttribute("data-mode");

      if (currentMode === "image") {
        photoBlock.style.display = "block";
        promptTitle.textContent = "📝 Опишите движение (необязательно)";
        promptEl.placeholder = "Например: плавное движение камеры...";
        btnText.textContent = "🖼 Оживить фото";
      } else {
        photoBlock.style.display = "none";
        promptTitle.textContent = "📝 Опишите видео";
        promptEl.placeholder = "Например: кот едет на скейтборде по закату...";
        btnText.textContent = "✨ Сгенерировать видео";
      }
    });
  });

  photoUpload.addEventListener("click", (e) => {
    if (e.target === removePhoto) return;
    if (!currentPhotoBase64) photoInput.click();
  });

  photoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      alert("Фото слишком большое (макс. 5 МБ)");
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentPhotoBase64 = ev.target.result;
      previewImg.src = currentPhotoBase64;
      uploadEmpty.style.display = "none";
      uploadPreview.style.display = "block";
      photoUpload.classList.add("has-photo");
    };
    reader.readAsDataURL(file);
  });

  removePhoto.addEventListener("click", (e) => {
    e.stopPropagation();
    currentPhotoBase64 = null;
    photoInput.value = "";
    uploadEmpty.style.display = "block";
    uploadPreview.style.display = "none";
    photoUpload.classList.remove("has-photo");
  });

  function getTodayKey() {
    const d = new Date();
    return `vg_usage_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
  }
  function getUsage() {
    return parseInt(localStorage.getItem(getTodayKey()) || "0", 10);
  }
  function incrementUsage() {
    localStorage.setItem(getTodayKey(), String(getUsage() + 1));
  }

  function getMyVideos() {
    try { return JSON.parse(localStorage.getItem("vg_videos") || "[]"); }
    catch { return []; }
  }
  function saveVideo(videoUrl, prompt) {
    const videos = getMyVideos();
    videos.unshift({ url: videoUrl, prompt: prompt, date: new Date().toISOString() });
    localStorage.setItem("vg_videos", JSON.stringify(videos.slice(0, 20)));
  }
  function loadGallery() {
    const videos = getMyVideos();
    gallery.innerHTML = "";
    if (videos.length === 0) {
      emptyState.style.display = "block";
      gallery.style.display = "none";
      return;
    }
    emptyState.style.display = "none";
    gallery.style.display = "grid";
    videos.forEach(v => {
      const item = document.createElement("div");
      item.className = "gallery-item";
      const dateStr = new Date(v.date).toLocaleDateString("ru-RU");
      item.innerHTML = `
        <video src="${v.url}" controls muted playsinline preload="metadata"></video>
        <div class="meta">${v.prompt.slice(0, 50)}<br>${dateStr}</div>
      `;
      gallery.appendChild(item);
    });
  }

  async function callGradio(prompt, photoBase64) {
    const callRes = await fetch(`https://${HF_SPACE}/call/${FN_NAME}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: [prompt || "animate this image"] })
    });

    if (!callRes.ok) {
      const err = await callRes.text();
      throw new Error(`Space недоступен: ${callRes.status} ${err.slice(0, 150)}`);
    }

    const { event_id } = await callRes.json();
    if (!event_id) throw new Error("Не получил event_id от Space");

    for (let i = 0; i < 120; i++) {
      await new Promise(r => setTimeout(r, 3000));

      const pollRes = await fetch(`https://${HF_SPACE}/call/${FN_NAME}/${event_id}`);
      if (!pollRes.ok) continue;

      const text = await pollRes.text();
      const lines = text.split("\n").filter(l => l.startsWith("data:"));
      for (const line of lines) {
        try {
          const json = JSON.parse(line.replace(/^data:\s*/, ""));
          if (json.msg === "process_completed" && json.output) {
            const out = json.output.data?.[0] ?? json.output?.[0];
            if (typeof out === "string" && out.startsWith("http")) return out;
            if (out && out.url) return out.url;
            if (out && out.path) return `https://${HF_SPACE}/file=${out.path}`;
            throw new Error("Не нашёл URL видео");
          }
        } catch (e) {}
      }
    }
    throw new Error("Превышено время ожидания");
  }

  generateBtn.addEventListener("click", async () => {
    const prompt = promptEl.value.trim();

    if (currentMode === "text" && !prompt) {
      statusEl.textContent = "Введите описание видео";
      return;
    }
    if (currentMode === "image" && !currentPhotoBase64) {
      statusEl.textContent = "Загрузите фото";
      return;
    }
    if (getUsage() >= 5) {
      statusEl.textContent = "❌ Лимит на сегодня исчерпан (5 генераций).";
      return;
    }

    generateBtn.disabled = true;
    resultEl.style.display = "none";
    progress.classList.add("active");

    try {
      statusEl.innerHTML = '<span class="spinner"></span>Отправляю запрос в Space...';
      const videoUrl = await callGradio(prompt, currentPhotoBase64);

      videoEl.src = videoUrl;
      resultEl.style.display = "block";
      statusEl.textContent = "✅ Готово!";
      incrementUsage();
      saveVideo(videoUrl, prompt || "[из фото]");
    } catch (e) {
      console.error(e);
      statusEl.textContent = "❌ " + e.message;
    } finally {
      generateBtn.disabled = false;
      progress.classList.remove("active");
    }
  });

  checkAuth();
</script>
